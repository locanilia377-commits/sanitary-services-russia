:root{color-scheme:light;--ink:#14282a;--muted:#486264;--bg:#edf3f1;--panel:#fff;--line:#d8e5e0;--accent:#006760;--dark:#102324;--mint:#a7f2d1;font-family:Onest,Arial,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}a{color:var(--accent);text-underline-offset:3px}a:hover{text-decoration-thickness:2px}button,select,input{font:inherit}button,select{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #18877b;outline-offset:3px}h1,h2,h3,p{margin:0}p{line-height:1.6}.container{width:min(1240px,calc(100% - 56px));margin:auto}.skip{position:absolute;top:-60px;background:white;padding:10px;z-index:10}.skip:focus{top:4px}.bar{background:var(--dark);color:#fff}.brand{display:flex;align-items:center;gap:28px;min-height:76px}.brand img{display:block;object-fit:contain;width:148px;height:auto}.brand-label{border-left:1px solid #4b6460;padding-left:28px;display:grid;gap:4px}.brand-label span{font-size:11px;color:#a8c4be;letter-spacing:.09em;text-transform:uppercase}.brand-label strong{font-size:14px}.sheet{margin-left:auto;color:var(--mint);font-size:14px;text-decoration:none;border:1px solid #486562;padding:10px 14px;border-radius:9px;white-space:nowrap}.nav-wrap{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.nav{display:flex;gap:26px;min-height:55px;align-items:stretch}.nav a{display:flex;align-items:center;position:relative;text-decoration:none;color:var(--muted);font-size:14px;font-weight:630}.nav a[aria-current]{color:var(--accent)}.nav a[aria-current]:after{content:"";height:3px;background:var(--accent);position:absolute;bottom:0;left:0;right:0;border-radius:5px 5px 0 0}
main{padding-block:28px 42px;min-height:65vh}.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at right bottom,#176259,transparent 57%),var(--dark);border-radius:24px;padding:44px 42px;color:#f7fffb;margin-bottom:24px}.hero:after{content:"";position:absolute;inset:0 0 0 52%;pointer-events:none;background:repeating-linear-gradient(122deg,transparent 0 29px,#a7f2d112 30px,transparent 31px 60px);mask-image:linear-gradient(90deg,transparent,black)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--accent);margin:0 0 10px}.hero .eyebrow{color:var(--mint)}h1{font-size:clamp(32px,5vw,62px);line-height:1.02;letter-spacing:-.052em;position:relative;z-index:1}h2{font-size:clamp(23px,3vw,34px);letter-spacing:-.04em;line-height:1.1}.hero p{max-width:720px;color:#c6dfd9;margin-top:14px;font-size:16px;position:relative;z-index:1}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 23px}.metric,.panel,.lead{background:var(--panel);border:1px solid var(--line);border-radius:17px}.metric{padding:18px;display:flex;flex-direction:column;gap:6px}.metric span{font-size:13px;color:var(--muted)}.metric strong{font-size:clamp(23px,3.2vw,39px);line-height:1.1;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.metric small{line-height:1.45;color:var(--muted);font-size:12px}.panel{padding:24px;margin-bottom:16px}.section-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:15px}.section-head p,.note,.lead p,.hint{font-size:13px;color:var(--muted)}.note{margin:10px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:#f1f7f4}th,td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}td strong{font-variant-numeric:tabular-nums}.filters{display:grid;grid-template-columns:1.55fr repeat(3,1fr);gap:12px}.filters label,.inputs label{display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:650}input,select{min-width:0;width:100%;min-height:42px;padding:8px 10px;border:1px solid #bdcfca;border-radius:9px;background:white;color:var(--ink)}.filter-more{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.filter-tools{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:15px}.button{border:1px solid #bfcec9;background:#f5faf7;color:var(--accent);border-radius:8px;padding:8px 12px;font-weight:670}.button:hover{background:#e3f3e9}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.lead{min-width:0;padding:17px;display:grid;gap:9px;align-content:start}.lead button{justify-self:start}.lead h3{font-size:18px;line-height:1.24;overflow-wrap:anywhere}.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pill{display:inline-flex;padding:5px 8px;background:#e0f4e9;border-radius:100px;color:#185740;font-size:11px;font-weight:750}.pill.pending{background:#f3ede0;color:#65461b}.pill.source{background:#edf2f3;color:#456266}.lead-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:12px;margin-top:3px}.lead .meta{font-size:11px}.notice{border-left:3px solid #128977;padding:11px 13px;background:#f0f8f4;border-radius:0 9px 9px 0}.empty{padding:23px 0;color:var(--muted)}details summary{font-weight:650;cursor:pointer;color:var(--accent)}details[open] summary{margin-bottom:12px}footer{border-top:1px solid var(--line);padding:20px 0 28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}dialog{max-width:min(730px,calc(100% - 24px));width:100%;max-height:88dvh;padding:27px;border:1px solid var(--line);border-radius:18px;color:var(--ink);overflow:auto}dialog::backdrop{background:#071e20a8}.close{position:absolute;right:12px;top:12px;border:0;background:#e8f4ef;border-radius:100%;width:36px;height:36px;font-size:23px;color:var(--accent)}.dialog-section{border-top:1px solid var(--line);margin-top:15px;padding-top:13px}.dialog-section p,.dialog-section li{font-size:13px;overflow-wrap:anywhere}.dialog-section ul{padding-left:20px}.dialog-section li{margin-block:6px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.model-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.progress{height:12px;width:100%;accent-color:var(--accent);margin-top:10px}.subhead{margin-bottom:12px}.lead-count{font-weight:700}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.container{width:calc(100% - 28px)}.brand{gap:12px;min-height:65px}.brand img{width:96px}.brand-label{padding-left:12px}.brand-label strong{font-size:11px}.brand-label span{font-size:8px}.sheet{padding:6px;font-size:10px}.nav{gap:12px;min-height:50px}.nav a{font-size:11px}.hero{padding:24px 18px;border-radius:17px}.hero p{font-size:14px}.metrics,.model-metrics,.split{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.panel{padding:15px}.inputs{grid-template-columns:1fr 1fr}.filter-tools{align-items:flex-start}.section-head{align-items:flex-start;flex-direction:column;gap:5px}.metric{padding:12px}.metric span{font-size:12px}.split{grid-template-columns:1fr}}

.split > .panel{min-width:0}

.split table{min-width:0}

@media(min-width:1100px){.lead-metrics{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:640px){.lead-metrics .metric:last-child{grid-column:1/-1}.filter-more label{font-size:13px;font-weight:650}.filter-more select{font-size:13px}}

.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 22px}
.market-charts{grid-template-columns:repeat(3,minmax(0,1fr))}
.chart{min-width:0;margin:0;padding:18px}
.chart figcaption{margin-bottom:14px}
.chart figcaption h3{font-size:17px;line-height:1.25;margin:0 0 5px}
.chart figcaption p,.chart-source{font-size:12px;color:var(--muted);line-height:1.4;margin:0}
.chart ul{padding:0;margin:0;list-style:none}
.chart-row{display:grid;grid-template-columns:minmax(93px,1.25fr) minmax(28px,1fr) max-content;align-items:center;gap:9px;width:100%;padding:6px 0;font:inherit;color:var(--ink);text-align:left}
.chart-row strong{font-size:13px;font-variant-numeric:tabular-nums}
.chart-label{font-size:12px;overflow-wrap:anywhere}
button.chart-row{border:0;background:transparent;cursor:pointer;border-radius:6px}
button.chart-row:hover,button.chart-row:focus-visible{background:#edf5f2}
.chart-track{height:9px;border-radius:10px;background:#e7eeec;overflow:hidden}
.chart-fill{display:block;width:var(--bar);height:100%;border-radius:10px;background:#137465}
.chart-fill.muted{background:#5d858a}
.chart-fill.soft{background:#a67a44}
.chart-source{border:0;margin-top:12px;padding:0;justify-content:flex-start}
.lead-price{font-size:13px;line-height:1.45;padding:9px 0}
.lead-price strong{color:var(--accent)}
.lead-price small,.price-status{color:var(--muted)}
#find-lead{scroll-margin-top:84px}
.price-section .chart-grid{margin-top:16px}
.price-section .chart{background:#f7faf9}
.scenario-chart{width:100%;max-width:760px;display:block;margin:4px auto 10px}
.scenario-chart text{fill:var(--muted);font-family:inherit;font-size:14px}
.scenario-chart path,.scenario-chart line{fill:none;stroke-width:2}
.scenario-chart .scenario-axis{stroke:#829593;stroke-width:1}
.scenario-turnover{stroke:#137465}.scenario-margin{stroke:#536c9c}.scenario-target{stroke:#9c733d;stroke-dasharray:6 5}
.scenario-turnover-dot{fill:#137465}.scenario-margin-dot{fill:#536c9c}
.scenario-legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin:10px 0;color:var(--muted);font-size:13px}
.scenario-legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#137465}
.scenario-legend span:nth-child(2)::before{background:#536c9c}
.scenario-legend span:nth-child(3)::before{background:#9c733d}
@media(max-width:980px){.market-charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:690px){.chart-grid,.market-charts{grid-template-columns:minmax(0,1fr);gap:10px}.chart{padding:14px}.chart-row{grid-template-columns:minmax(95px,1.15fr) minmax(18px,1fr) max-content}.scenario-chart text{font-size:20px}}
</style>

function chart(title, detail, rows, options = {}) {
 const max = options.max ?? Math.max(1, ...rows.map(r => r.value ?? 0));
 const show = options.format ?? (value => nf.format(value));
 const bars = rows.map(row => {
  const value = row.value;
  const indicator = value == null ? 'н/д' : show(value);
  const geometry = value == null ? '' : '<span class="chart-fill '+esc(row.tone??'')+'" style="--bar:'+Math.max(0, value/max*100)+'%"></span>';
  const label = '<span class="chart-label">'+esc(row.label)+'</span>';
  const track = '<span class="chart-track" aria-hidden="true">'+geometry+'</span><strong>'+esc(indicator)+'</strong>';
  return '<li>'+(row.filter ? '<button class="chart-row" data-chart-filter="'+esc(row.filter[0])+'" data-chart-value="'+esc(row.filter[1])+'" type="button" title="Отфильтровать список">'+label+track+'</button>' : '<div class="chart-row">'+label+track+'</div>')+'</li>';
 }).join('');
 return '<figure class="panel chart"><figcaption><h3>'+esc(title)+'</h3><p>'+esc(detail)+'</p></figcaption><ul>'+bars+'</ul>'+(options.source?'<footer class="chart-source">'+options.source+'</footer>':'')+'</figure>';
}

function marketCharts(){
 const records = label => market.filter(r=>r[1]===label&&r[0]==='Астраханская область');
 const selected = (label,year) => records(label).find(r=>r[2]===year);
 const income = 'Среднедушевой денежный доход в месяц';
 const median = 'Медианный среднедушевой денежный доход';
 const poverty = 'Доля жителей с доходом ниже границы бедности';
 const registry = records('Количество субъектов МСП').filter(r=>r[2].startsWith('10.10.')).sort((a,b)=>a[2].slice(-4).localeCompare(b[2].slice(-4)));
 const rows = (label, periods) => periods.map(p=>({label:p,value:selected(label,p)?.[3]}));
 const primary = (label, period) => {
  const r=selected(label,period);
  return r?link(r[7],r[5]+' ↗'):'';
 };
 const incomeChart=chart('Доходы на человека','Астраханская область · рублей в месяц',[
  ...rows(income,['2024','2025']).map(x=>({...x,label:'Средний · '+x.label})),
  ...rows(median,['2024','2025']).map(x=>({...x,label:'Медианный · '+x.label,tone:'muted'})),
 ],{format:value=>money.format(value),source:primary(income,'2025')+' · '+primary(median,'2024')});
 const povertyChart=chart('Доход ниже границы бедности','Доля населения области. 2025 год — предварительная оценка.',rows(poverty,['2024','2025']),{
  format:value=>nf.format(value)+'%',source:primary(poverty,'2025')
 });
 const registryChart=chart('Малый и средний бизнес','Субъекты МСП области · снимки реестра на 10 октября',registry.map(r=>({label:r[2].slice(-4),value:r[3]})),{

function scenarioChart(points,target,margin,unit){
 const width=680,height=245,pad=50,limit=Math.max(5,points,target);
 const x=p=>pad+(width-2*pad)*p/limit;
 const y=value=>height-pad-(height-2*pad)*value/(limit*unit);
 const turnover=p=>p*unit;
 const revenue=turnover(points);
 const profit=revenue*margin/100;
 const marks=[...new Set([0,Math.round(limit/2),limit])];
 const labels=marks.map(p=>'<text x="'+x(p)+'" y="'+(height-18)+'" text-anchor="middle">'+nf.format(p)+'</text>').join('');
 return '<svg class="scenario-chart" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Сценарий по подключённым точкам. Оборот '+esc(money.format(revenue))+', по марже '+esc(money.format(profit))+'"><path class="scenario-axis" d="M'+pad+' '+pad+'V'+(height-pad)+'H'+(width-pad)+'"/>'+labels+
  '<text x="'+pad+'" y="'+(pad-15)+'">'+esc(money.format(turnover(limit)))+'</text>'+
  '<path class="scenario-turnover" d="M'+x(0)+' '+y(0)+'L'+x(limit)+' '+y(turnover(limit))+'"/>'+
  '<path class="scenario-margin" d="M'+x(0)+' '+y(0)+'L'+x(limit)+' '+y(turnover(limit)*margin/100)+'"/>'+
  '<line class="scenario-target" x1="'+x(target)+'" x2="'+x(target)+'" y1="'+pad+'" y2="'+y(0)+'"/>'+
  '<circle class="scenario-turnover-dot" cx="'+x(points)+'" cy="'+y(revenue)+'" r="5"/>'+
  '<circle class="scenario-margin-dot" cx="'+x(points)+'" cy="'+y(profit)+'" r="5"/>'+
  '<text x="'+(width-pad)+'" y="'+(height-2)+'" text-anchor="end">Подключённые точки</text></svg>';
}

 +'<section class="panel"><h2 class="subhead">Корзина одной точки</h2>'+table(['Рулоны в месяц','Количество','Цена'],tr([['Тонировочная плёнка','1','13 000 ₽'],['Атермальная плёнка','1','30 000 ₽'],['Полиуретановая плёнка','3','52 000 ₽']],r=>r))+'<p class="note">Сценарий предыдущего регионального обзора. Итого 5 рулонов и 199 000 ₽ на точку в месяц.</p></section></div><section class="metrics model-metrics" id="modelMetrics" aria-live="polite"></section><section class="panel"><h2>Как меняется месячный результат</h2><p class="scenario-legend"><span>Оборот</span><span>Сумма по марже</span><span>Цель по точкам</span></p><div id="scenarioChart"></div><p class="note">Корзина, маржа и цель заданы как сценарий. Сумма по марже считается до прочих расходов.</p></section>';
 const field=id=>document.querySelector('#'+id);
 for(const [id,value] of Object.entries(modelInputs))field(id).value=value;
 function update(){
  const points=Math.trunc(Math.max(0,Math.min(10000,field('outlets').valueAsNumber||0)));
  const target=Math.trunc(Math.max(1,Math.min(10000,field('target').valueAsNumber||1)));
  const margin=Math.max(0,Math.min(100,field('margin').valueAsNumber||0));
  Object.assign(modelInputs,{outlets:points,target,margin});
  const pct=points/target*100;
  field('goal').value=Math.min(pct,100);
  field('goalLabel').textContent='Подключено '+points+' из '+target+' · '+nf.format(pct)+'% цели';
  field('modelMetrics').innerHTML=metric('Оборот / месяц',money.format(points*199000),'Подключённые точки × корзина')+metric('По марже / месяц',money.format(points*199000*margin/100),'При марже '+nf.format(margin)+'%')+metric('Рулонов / месяц',nf.format(points*5),'5 рулонов на точку');
  field('scenarioChart').innerHTML=scenarioChart(points,target,margin,199000);
 }
 for(const id of ['outlets','target','margin'])field(id).addEventListener('input',update);
 field('example').addEventListener('click',()=>{field('outlets').value=10;field('target').value=10;field('margin').value=20;update();});
 update();
}
const views={market:marketView,leads:leadsView,model:modelView};
function route(){
 const key=location.hash.slice(1);
 const tab=Object.hasOwn(views,key)?key:'market';
 for(const a of document.querySelectorAll('.nav a'))if(a.hash==='#'+tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
 views[tab]();
}
main.addEventListener('click',e=>{
 const button=e.target.closest('button[data-lead]');
 if(button)openLead(button.dataset.lead);
 const filter=e.target.closest('button[data-chart-filter]');
 if(filter){
  Object.assign(state,filtersDefault,{[filter.dataset.chartFilter]:filter.dataset.chartValue});
  leadsView();
  document.querySelector('#'+filter.dataset.chartFilter).focus();
  document.querySelector('#find-lead').scrollIntoView({block:'start'});
 }
});
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0});});
route();
</script>
